[project]
name = "repo-rag"
version = "0.1.0"
description = "Repository-aware RAG over the AI4SE playground: AST chunking and libSQL vector search"
authors = [
    { name = "Juraj Petras", email = "jurkopetras@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "libsql>=0.1.11",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
repo-rag = "repo_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["AI4SE_Playground"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
